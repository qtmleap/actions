name: Ruby check
description: Run a trusted check with readonly source and verified runtime in pinned Ruby Docker
inputs:
  repo-root:
    description: App checkout relative to GITHUB_WORKSPACE
    default: '.'
  command:
    description: Trusted shell command
    required: true
  working-directory:
    description: Repository-relative working directory
    default: '.'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SHARED_REPO_ROOT: ${{ inputs.repo-root }}
        SHARED_ACTION_PATH: ${{ github.action_path }}
        SHARED_COMMAND: ${{ inputs.command }}
        SHARED_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: bash "$SHARED_ACTION_PATH/../../runtime/docker-action.sh" ruby-check
